# Render Blueprint — FREE plan deployment for TejaratYar
services:
  - type: web
    name: tejaratyar
    runtime: image
    repo: https://github.com/Setayesh-Jafari/tejaratyar
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    region: frankfurt
    numInstances: 1

    envVars:
      - key: APP_TIMEZONE
        value: Asia/Tehran
      - key: DATA_DIR
        value: /data
      - key: MAX_ACTIVE_JOBS
        value: "3"
      - key: JOB_TTL_HOURS
        value: "24"